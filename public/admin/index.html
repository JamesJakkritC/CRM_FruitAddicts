<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Fruit Addicts CRM — Staff Console</title>
<style>
  :root{
    --bg:#f3f7f4; --card:#fff; --ink:#1c2b22; --muted:#5f7268; --line:#e2ebe5;
    --brand:#0f9d58; --brand-dark:#0b7a41; --brand2:#34b36b; --accent:#0f9d58; --warn:#92400e; --warnbg:#fef3c7;
    --radius:12px; --sidebar:#123527; --surface-2:#f0f4f1; --panel:#e3f2e9; --brand-deep:#08522b;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Thai",sans-serif;background:var(--bg);color:var(--ink)}
  a{color:var(--accent)}
  code{background:#f0f0f3;padding:1px 5px;border-radius:5px;font-size:.9em}
  button{cursor:pointer;border:none;border-radius:8px;padding:8px 12px;background:var(--accent);color:#fff;font-weight:600;font:inherit}
  button.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
  button.brand{background:var(--brand)}
  button.sm{padding:5px 9px;font-size:13px}
  input,select,textarea{padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;font:inherit}
  label{font-size:12px;color:var(--muted)}
  .field{display:flex;flex-direction:column;gap:4px}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:end}
  .cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
  table{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
  th,td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--line);font-size:14px}
  th{background:#fafafa;color:var(--muted);font-weight:600;font-size:12px}
  tr:last-child td{border-bottom:none}
  .pill{display:inline-block;padding:2px 8px;border-radius:999px;font-size:12px;background:#eef2ff;color:#3730a3}
  .pill.warn{background:var(--warnbg);color:var(--warn)}
  .muted{color:var(--muted)} .err{color:#b91c1c;font-size:13px} .ok{color:#166534;font-size:13px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:14px}
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
  .card h3{margin:0 0 6px;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.03em}
  .card .big{font-size:26px;font-weight:800}
  /* login */
  #login{min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#fff,#e3f5ea)}
  #login .box{background:#fff;border:1px solid var(--line);border-radius:16px;padding:28px;width:340px;box-shadow:0 12px 40px rgba(0,0,0,.08)}
  #login h1{font-size:20px;margin:0 0 4px}
  #login .box .field{margin-top:12px}
  /* app shell */
  #app{display:none;grid-template-columns:220px 1fr;min-height:100vh}
  aside{background:var(--sidebar);color:#cfd3dc;padding:16px 10px;display:flex;flex-direction:column;gap:4px}
  aside .brand{color:#fff;font-weight:800;padding:8px 10px 14px;font-size:16px}
  aside a{display:block;color:#cfd3dc;text-decoration:none;padding:9px 12px;border-radius:8px;font-size:14px;cursor:pointer}
  aside a:hover{background:#1c4a36}
  aside a.active{background:var(--brand);color:#fff}
  aside .navgroup{font-size:10px;color:#7f8f84;padding:14px 12px 4px;text-transform:uppercase;letter-spacing:.05em;font-weight:700}
  aside .who{margin-top:auto;font-size:12px;color:#9aa1b1;padding:10px}
  .tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
  .tile{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;cursor:pointer;transition:.12s;display:flex;gap:12px;align-items:flex-start}
  .tile:hover{border-color:var(--brand);box-shadow:0 6px 18px rgba(15,157,88,.10);transform:translateY(-1px)}
  .tile.soon{cursor:default;opacity:.7}
  .tile.soon:hover{border-color:var(--line);box-shadow:none;transform:none}
  .tile .ico{font-size:22px;line-height:1}
  .tile h4{margin:0 0 4px;font-size:15px}
  .tile p{margin:0;font-size:12px;color:var(--muted);line-height:1.4}
  .tile .soonbadge{display:inline-block;margin-top:6px;font-size:11px;background:#eef1f4;color:#6b7280;padding:1px 7px;border-radius:999px}
  .crumb{font-size:13px;color:var(--muted);margin-bottom:10px}
  .crumb a{cursor:pointer}
  .dropzone{border:2px dashed var(--line);border-radius:14px;padding:24px;text-align:center;color:var(--muted);cursor:pointer;transition:.12s;background:var(--surface-2)}
  .dropzone.drag{border-color:var(--brand);background:var(--panel);color:var(--brand-deep)}
  .dropzone b{color:var(--ink)}
  .progress{height:8px;background:var(--line);border-radius:999px;overflow:hidden;margin-top:12px;display:none}
  .progress > i{display:block;height:100%;width:0;background:var(--brand);transition:width .15s}
  main{padding:22px;max-width:1080px}
  main h2{font-size:18px;margin:0 0 14px}
  .topbar{display:flex;align-items:center;gap:10px;margin-bottom:16px}
  .grow{flex:1}
  .linkish{color:var(--accent);cursor:pointer;text-decoration:underline}
  .banner{background:var(--warnbg);color:var(--warn);border:1px solid #fde68a;border-radius:10px;padding:10px 12px;font-size:13px;margin-bottom:14px}
</style>
</head>
<body>
<!-- LOGIN -->
<div id="login">
  <div class="box">
    <h1>🍉 Fruit Addicts</h1>
    <div class="muted" style="font-size:13px">Staff Console — เข้าสู่ระบบ</div>
    <div class="field"><label>ชื่อผู้ใช้</label><input id="l_user" autocomplete="username" /></div>
    <div class="field"><label>รหัสผ่าน</label><input id="l_pass" type="password" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()" /></div>
    <button class="brand" style="width:100%;margin-top:16px" onclick="doLogin()">เข้าสู่ระบบ</button>
    <div id="l_err" class="err" style="margin-top:10px"></div>
    <div class="muted" style="margin-top:14px;font-size:12px">เดโม: admin / (ADMIN_BOOTSTRAP_PASSWORD) · cashier_nimman / cashier-pilot-8</div>
  </div>
</div>

<!-- APP -->
<div id="app">
  <aside>
    <div class="brand">🍉 Fruit Addicts</div>
    <nav id="nav"></nav>
    <div class="who" id="who"></div>
    <a onclick="doLogout()" style="color:#9fe3bf">ออกจากระบบ</a>
  </aside>
  <main>
    <div id="view"></div>
  </main>
</div>

<script>
const $=(id)=>document.getElementById(id);
const el=(h)=>{const d=document.createElement('div');d.innerHTML=h;return d;};
const thb=(s)=>'฿'+(s/100).toLocaleString('th-TH',{minimumFractionDigits:2});
const esc=(s)=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let TOKEN=localStorage.getItem('fa_token')||'';
let ME=null, PERMS=new Set(), BRANCHES=[], TIERS=[], TAGS=[];

async function api(path,opts={}){
  const res=await fetch('/api'+path,{...opts,headers:{'content-type':'application/json',authorization:'Bearer '+TOKEN,...(opts.headers||{})}});
  if(res.status===401){ logoutLocal(); throw new Error('เซสชันหมดอายุ กรุณาเข้าสู่ระบบใหม่'); }
  const data=await res.json().catch(()=>({}));
  if(!res.ok) throw new Error(data?.error?.message||('HTTP '+res.status));
  return data;
}
const can=(p)=>PERMS.has(p);

async function doLogin(){
  $('l_err').textContent='';
  try{
    const r=await fetch('/api/auth/login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({username:$('l_user').value,password:$('l_pass').value})});
    const d=await r.json(); if(!r.ok) throw new Error(d?.error?.message||'เข้าสู่ระบบไม่สำเร็จ');
    TOKEN=d.token; localStorage.setItem('fa_token',TOKEN); await boot();
  }catch(e){ $('l_err').textContent=e.message; }
}
function logoutLocal(){ TOKEN=''; localStorage.removeItem('fa_token'); $('app').style.display='none'; $('login').style.display='grid'; }
async function doLogout(){ try{ await api('/auth/logout',{method:'POST'}); }catch(e){} logoutLocal(); }

const NAV=[
  {group:'ภาพรวม',items:[{id:'dashboard',label:'📊 แดชบอร์ด',perm:'reports.read'}]},
  {group:'ลูกค้า',items:[
    {id:'members',label:'👤 สมาชิก',perm:'members.read'},
    {id:'referral',label:'🤝 แนะนำเพื่อน',perm:'referrals.read'},
  ]},
  {group:'การขาย',items:[
    {id:'pos',label:'🧾 POS / บันทึกซื้อ',perm:'transactions.create'},
    {id:'receipts',label:'📸 ใบเสร็จรออนุมัติ',perm:'receipts.review'},
    {id:'posimport',label:'📥 นำเข้า POS / สินค้า',perm:'pos.import'},
    {id:'coupons',label:'🎟️ คูปอง / ของรางวัล',perm:'coupons.read'},
  ]},
  {group:'การตลาด',items:[
    {id:'campaigns',label:'📣 แคมเปญ / Broadcast',perm:'campaigns.read'},
    {id:'richmenu',label:'🧩 Rich Menu',perm:'campaigns.read'},
  ]},
  {group:'ตั้งค่า',items:[
    {id:'store',label:'🏪 ตั้งค่าร้านค้า',perm:'__store'},
    {id:'audit',label:'📜 Audit log',perm:'audit.read'},
  ]},
];
// store hub is visible if the user can manage any store-settings area
function canSee(perm){ return perm==='__store' ? (can('settings.manage')||can('branches.manage')||can('users.manage')) : can(perm); }
const STORE_SUBVIEWS=['store','store_info','branches','points_settings','tiers','tags','theme','signup','pos','settings','users'];

async function boot(){
  try{
    const me=await api('/auth/me'); ME=me.principal; PERMS=new Set(me.permissions);
    $('login').style.display='none'; $('app').style.display='grid';
    $('who').innerHTML=`<b style="color:#fff">${esc(ME.username)}</b><br>${ME.roles.join(', ')}${ME.branchIds.length?'<br>สาขา: '+ME.branchIds.join(', '):''}`;
    try{ BRANCHES=(await api('/admin/branches')).branches; }catch(e){ BRANCHES=[]; }
    try{ TIERS=(await api('/admin/tiers')).tiers; }catch(e){ TIERS=[]; }
    try{ TAGS=(await api('/admin/tags')).tags; }catch(e){ TAGS=[]; }
    const nav=$('nav'); nav.innerHTML=''; let firstId=null;
    for(const g of NAV){
      const visible=g.items.filter(n=>canSee(n.perm));
      if(!visible.length) continue;
      const h=document.createElement('div'); h.className='navgroup'; h.textContent=g.group; nav.appendChild(h);
      for(const n of visible){ const a=document.createElement('a'); a.textContent=n.label; a.id='nav_'+n.id; a.onclick=()=>go(n.id); nav.appendChild(a); if(!firstId)firstId=n.id; }
    }
    updateReceiptBadge();
    go(firstId||'none');
  }catch(e){
    logoutLocal();
  }
}
async function updateReceiptBadge(){ if(!can('receipts.review'))return; try{ const n=(await api('/admin/receipts?status=pending')).claims.length; const a=$('nav_receipts'); if(a) a.textContent='📸 ใบเสร็จรออนุมัติ'+(n?` (${n})`:''); }catch(e){} }
function go(id){
  document.querySelectorAll('#nav a').forEach(a=>a.classList.remove('active'));
  const navId=STORE_SUBVIEWS.includes(id)?'store':id;
  const a=$('nav_'+navId); if(a)a.classList.add('active');
  (VIEWS[id]||VIEWS.none)();
}
const branchName=(id)=>{const b=BRANCHES.find(x=>x.branch_id===id||x.id===id);return b?b.name:id;};
const branchOptions=(sel)=>BRANCHES.map(b=>`<option value="${b.id}" ${b.id===sel?'selected':''}>${esc(b.name)}</option>`).join('');

const VIEWS={};
VIEWS.none=()=>{ $('view').innerHTML='<div class="card">ไม่มีสิทธิ์เข้าถึงเมนูใด ๆ ติดต่อผู้ดูแลระบบ</div>'; };

// ---- Dashboard ----
VIEWS.dashboard=async()=>{
  $('view').innerHTML='<h2>Dashboard</h2><div id="d"></div>';
  try{
    const o=await api('/admin/overview');
    const cards=[['สมาชิก',o.members],['Active 90 วัน',o.activeMembers90d],['Point liability',o.pointLiability.toLocaleString()],['ยอดขายสมาชิก',thb(o.salesFromMembersSatang)],['Transactions',o.transactions],['Coupon ใช้',o.couponRedemptions]];
    const top=(await api('/admin/top-customers?limit=8')).customers;
    const br=(await api('/admin/sales-by-branch')).branches;
    $('d').innerHTML=`<div class="cards">${cards.map(([k,v])=>`<div class="card"><h3>${k}</h3><div class="big">${v}</div></div>`).join('')}</div>
      <div class="card"><h3>Segments</h3><div>${Object.entries(o.segments).map(([k,v])=>`<span class="pill" style="margin:3px">${k}: ${v}</span>`).join('')||'—'}</div></div>
      <div class="card"><h3>Top customers</h3><table><thead><tr><th>Member</th><th>Visits</th><th>Spend</th></tr></thead><tbody>${top.map(c=>`<tr><td>${esc(c.member_code)} <span class="muted">${esc(c.display_name||'')}</span></td><td>${c.visits}</td><td>${thb(c.spend_satang)}</td></tr>`).join('')||'<tr><td colspan=3 class=muted>—</td></tr>'}</tbody></table></div>
      <div class="card"><h3>ยอดขายแยกสาขา</h3><table><thead><tr><th>สาขา</th><th>Txns</th><th>Sales</th><th>ลูกค้า</th></tr></thead><tbody>${br.map(b=>`<tr><td>${esc(b.name)}</td><td>${b.transactions}</td><td>${thb(b.sales_satang)}</td><td>${b.unique_members}</td></tr>`).join('')}</tbody></table></div>`;
  }catch(e){ $('d').innerHTML=`<div class="banner">${esc(e.message)} — Dashboard เป็นรายงานรวมทุกสาขา ต้องใช้บทบาทที่เข้าถึงได้ทุกสาขา</div>`; }
};

// ---- Members ----
VIEWS.members=async()=>{
  $('view').innerHTML=`<h2>สมาชิก</h2>
    <div class="row" style="margin-bottom:12px"><div class="field"><label>ค้นหา</label><input id="m_q" placeholder="ชื่อ/เบอร์/รหัส"/></div>
    <button onclick="loadMembers()">ค้นหา</button>${can('members.write')?'<button class="ghost" onclick="newMemberForm()">+ เพิ่มสมาชิก</button>':''}</div>
    <div id="m_list"></div><div id="m_detail"></div>`;
  loadMembers();
};
async function loadMembers(){
  const q=$('m_q')?.value.trim()||'';
  const r=await api('/admin/members?limit=30'+(q?'&search='+encodeURIComponent(q):''));
  $('m_list').innerHTML=`<table><thead><tr><th>Code</th><th>ชื่อ</th><th>Tier</th><th>สาขา</th><th></th></tr></thead><tbody>${
    r.members.map(m=>`<tr><td>${esc(m.member_code)}</td><td>${esc(m.display_name||m.nickname||'-')}</td><td><span class="pill">${tierLabel(m.tier)}</span></td><td>${esc(branchName(m.home_branch_id))}</td><td><span class="linkish" onclick="view360(${m.id})">เปิด</span></td></tr>`).join('')||'<tr><td colspan=5 class=muted>ไม่พบ</td></tr>'
  }</tbody></table>`;
}
function newMemberForm(){
  $('m_detail').innerHTML=`<div class="card"><h3>เพิ่มสมาชิก</h3><div class="row">
    <div class="field"><label>ชื่อ</label><input id="nm_name"/></div>
    <div class="field"><label>เบอร์</label><input id="nm_phone"/></div>
    <div class="field"><label>วันเกิด</label><input id="nm_bday" placeholder="YYYY-MM-DD"/></div>
    <div class="field"><label>สาขาหลัก</label><select id="nm_branch">${branchOptions(ME.branchIds[0]||'')}</select></div>
    <button class="brand" onclick="createMember()">บันทึก</button></div><div id="nm_out" class="muted"></div></div>`;
}
async function createMember(){
  try{ const m=await api('/admin/members',{method:'POST',body:JSON.stringify({displayName:$('nm_name').value,phone:$('nm_phone').value,birthday:$('nm_bday').value||null,homeBranchId:$('nm_branch').value})});
    $('nm_out').innerHTML='<span class="ok">เพิ่มแล้ว</span>'; loadMembers(); view360(m.member.id);
  }catch(e){ $('nm_out').innerHTML='<span class="err">'+esc(e.message)+'</span>'; }
}
async function view360(id){
  const d=await api('/admin/members/'+id+'/360'); const s=d.stats; const m=d.member;
  let ref=''; try{ const rs=await api('/admin/members/'+id+'/referral'); ref=`<span class="pill">แนะนำ ${rs.totalReferred} (สำเร็จ ${rs.rewarded})</span>`; }catch(e){}
  let mtags=[]; try{ mtags=(await api('/admin/members/'+id+'/tags')).tags; }catch(e){}
  let mitems=[]; try{ mitems=(await api('/admin/members/'+id+'/items')).items; }catch(e){}
  let consent=null; try{ consent=await api('/admin/members/'+id+'/consent'); }catch(e){}
  const editable=can('members.write');
  $('m_detail').innerHTML=`<div class="card">
    <div class="row"><h3 style="margin:0">${esc(m.display_name||m.nickname||m.member_code)}</h3>${m.nickname?`<span class="muted">(${esc(m.nickname)})</span>`:''}<span class="pill" style="background:#e6f4ea;color:#0b7a41">${tierLabel(m.tier)}</span><span class="pill">${d.segment}</span>${ref}</div>
    <div class="cards" style="margin:12px 0">
      <div class="card"><h3>Balance</h3><div class="big">${s.pointBalance}</div></div>
      <div class="card"><h3>Visits</h3><div class="big">${s.visits}</div></div>
      <div class="card"><h3>CLV</h3><div class="big">${thb(d.clvSatang)}</div></div>
      <div class="card"><h3>Recency</h3><div class="big">${s.recencyDays??'-'}</div></div>
    </div>
    <div style="margin:6px 0 10px"><b style="font-size:13px">แท็ก:</b> ${mtags.map(t=>tagChip(id,t,editable)).join('')||'<span class="muted">—</span>'}
      ${editable?`<select onchange="addMTag(${id},this.value)" style="font-size:12px;margin-left:6px"><option value="">+ เพิ่มแท็ก</option>${TAGS.filter(t=>!mtags.some(x=>x.id===t.id)).map(t=>`<option value="${t.id}">${esc(t.name)}</option>`).join('')}</select>`:''}</div>
    ${m.extra_json?`<div class="muted" style="font-size:12px;margin-bottom:8px">ข้อมูลเพิ่มเติม: ${Object.entries(JSON.parse(m.extra_json)).map(([k,v])=>esc(k)+': '+esc(v)).join(' · ')}</div>`:''}
    ${editable?`<div class="row">
      <div class="field"><label>ชื่อ</label><input id="e_name" value="${esc(m.display_name||'')}"/></div>
      <div class="field"><label>ชื่อเล่น</label><input id="e_nick" value="${esc(m.nickname||'')}"/></div>
      <div class="field"><label>เบอร์</label><input id="e_phone" value="${esc(m.phone||'')}"/></div>
      <div class="field"><label>เดือนเกิด</label><select id="e_bm"><option value="">-</option>${[...Array(12)].map((_,i)=>`<option value="${i+1}" ${m.birth_month===i+1?'selected':''}>${i+1}</option>`).join('')}</select></div>
      <div class="field"><label>ยุคเกิด</label><select id="e_bc"><option value="">-</option><option value="2000" ${m.birth_century===2000?'selected':''}>2000s</option><option value="1900" ${m.birth_century===1900?'selected':''}>1900s</option></select></div>
      <div class="field"><label>Tier (ตั้งเอง)</label><select id="e_tier">${(TIERS.length?TIERS.map(t=>t.code):['basic','bronze']).concat(TIERS.some(t=>t.code===m.tier)?[]:[m.tier]).map(c=>`<option value="${c}" ${c===m.tier?'selected':''}>${esc(tierLabel(c))}</option>`).join('')}</select></div>
      <div class="field"><label>สถานะ</label><select id="e_status">${['active','blocked'].map(t=>`<option ${t===m.status?'selected':''}>${t}</option>`).join('')}</select></div>
      <button class="sm" onclick="saveMember(${id})">บันทึก</button></div>`:''}
    ${can('points.adjust')?`<div class="row" style="margin-top:10px"><div class="field"><label>ปรับแต้ม (+/-)</label><input id="adj" type="number"/></div><button class="sm ghost" onclick="adjust(${id})">ปรับแต้ม</button><span id="adjout" class="muted"></span></div>`:''}
    ${upgradeBlock(id, m.tier)}
    ${pdpaBlock(id, m, consent, editable)}
    <h3 style="margin:14px 0 6px" class="muted">ประวัติแต้ม</h3>
    <table><thead><tr><th>Type</th><th>Δ</th><th>Balance</th><th>เมื่อ</th></tr></thead><tbody>${d.recentLedger.map(l=>`<tr><td>${l.type}</td><td>${l.delta}</td><td>${l.balance_after}</td><td class=muted>${new Date(l.created_at).toLocaleString('th-TH')}</td></tr>`).join('')||'<tr><td colspan=4 class=muted>—</td></tr>'}</tbody></table>
    ${mitems.length?`<h3 class="muted" style="margin:14px 0 6px">สินค้าที่เคยซื้อ (จาก POS)</h3><table><thead><tr><th>วันที่</th><th>สินค้า</th><th>ยอด</th></tr></thead><tbody>${mitems.slice(0,25).map(x=>`<tr><td class=muted>${esc(x.bill_date||'')}</td><td>${esc(String(x.name).slice(0,44))}</td><td>${thb(x.net_satang)}</td></tr>`).join('')}</tbody></table>`:''}
  </div>`;
}
async function saveMember(id){ try{ const bm=$('e_bm').value, bc=$('e_bc').value; await api('/admin/members/'+id,{method:'PATCH',body:JSON.stringify({displayName:$('e_name').value,nickname:$('e_nick').value,phone:$('e_phone').value,birthMonth:bm?parseInt(bm,10):null,birthCentury:bc?parseInt(bc,10):null,tier:$('e_tier').value,status:$('e_status').value})}); view360(id); loadMembers(); }catch(e){ alert(e.message);} }
async function adjust(id){ const v=parseInt($('adj').value,10); if(!v)return; try{ await api('/admin/members/'+id+'/points/adjust',{method:'POST',headers:{'idempotency-key':'adj-'+id+'-'+Date.now()},body:JSON.stringify({delta:v,note:'console'})}); view360(id);}catch(e){ $('adjout').innerHTML='<span class=err>'+esc(e.message)+'</span>'; } }
const tierLabel=(code)=>{const t=TIERS.find(x=>x.code===code);return t?t.name:(code||'-');};
const tagChip=(id,t,ed)=>`<span class="pill" style="background:${t.color||'#0f9d58'};color:#fff;margin-right:4px">${esc(t.name)}${ed?` <span style="cursor:pointer" onclick="rmMTag(${id},${t.id})">✕</span>`:''}</span>`;
async function addMTag(id,tagId){ if(!tagId)return; try{ await api('/admin/members/'+id+'/tags',{method:'POST',body:JSON.stringify({tagId:parseInt(tagId,10)})}); view360(id); }catch(e){ alert(e.message); } }
async function rmMTag(id,tagId){ try{ await api('/admin/members/'+id+'/tags/'+tagId,{method:'DELETE'}); view360(id); }catch(e){ alert(e.message); } }
function pdpaBlock(id,m,consent,editable){
  if(!consent) return '';
  const anon = m.status==='anonymized' || m.anonymized_at;
  if(anon) return `<div class="card" style="margin-top:12px;border-color:#cbd5cb"><h3 class="muted">PDPA</h3><span class="pill" style="background:#eee">ลบข้อมูลส่วนตัวแล้ว (${m.anonymized_at?new Date(m.anonymized_at).toLocaleDateString('th-TH'):''})</span></div>`;
  const c=consent.consent||consent;
  const hist=(consent.history||[]);
  const chk=(k,label)=>`<label style="margin-right:16px;font-size:13px"><input type="checkbox" id="cons_${k}" ${c[k]?'checked':''} ${editable?'':'disabled'}/> ${label}</label>`;
  return `<div class="card" style="margin-top:12px">
    <div class="row"><h3 style="margin:0">PDPA · ความยินยอม</h3>
      <button class="sm ghost" onclick="exportMemberUI(${id})">⬇ Export ข้อมูล (JSON)</button></div>
    <div style="margin:8px 0">${chk('service','บริการ/ระบบสมาชิก')} ${chk('marketing','การตลาด/โปรโมชัน')}
      ${editable?`<button class="sm" onclick="saveConsent(${id})">บันทึกความยินยอม</button>`:''}
      <span class="muted" style="font-size:12px">อัปเดตล่าสุด: ${c.updated_at?new Date(c.updated_at).toLocaleString('th-TH'):'-'}</span></div>
    ${hist.length?`<details style="margin:4px 0"><summary class="muted" style="font-size:12px;cursor:pointer">ประวัติความยินยอม (${hist.length})</summary>
      <table style="margin-top:6px"><thead><tr><th>เมื่อ</th><th>บริการ</th><th>การตลาด</th><th>ที่มา</th></tr></thead><tbody>${hist.map(h=>`<tr><td class=muted>${new Date(h.created_at).toLocaleString('th-TH')}</td><td>${h.consent_service?'✓':'—'}</td><td>${h.consent_marketing?'✓':'—'}</td><td>${esc(h.source||'')}</td></tr>`).join('')}</tbody></table></details>`:''}
    ${editable?`<div style="margin-top:10px;border-top:1px solid #eee;padding-top:10px"><span class="muted" style="font-size:12px">สิทธิการลบข้อมูล — ลบข้อมูลส่วนตัวถาวร (เก็บประวัติการเงินไว้เพื่อบัญชี) ย้อนกลับไม่ได้</span><br>
      <button class="sm" style="background:#b3261e;margin-top:6px" onclick="anonymizeUI(${id})">🗑 ลบข้อมูลส่วนตัว (Anonymize)</button></div>`:''}
  </div>`;
}
async function saveConsent(id){ try{ await api('/admin/members/'+id+'/consent',{method:'POST',body:JSON.stringify({service:$('cons_service').checked,marketing:$('cons_marketing').checked})}); view360(id); }catch(e){ alert(e.message); } }
async function exportMemberUI(id){ try{ const d=await api('/admin/members/'+id+'/export'); const blob=new Blob([JSON.stringify(d,null,2)],{type:'application/json'}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='member-'+id+'-export.json'; a.click(); URL.revokeObjectURL(a.href); }catch(e){ alert(e.message); } }
async function anonymizeUI(id){ if(!confirm('ยืนยันการลบข้อมูลส่วนตัวของสมาชิกนี้แบบถาวร?\nชื่อ/เบอร์/LINE จะถูกลบและย้อนกลับไม่ได้ (ประวัติการเงินยังอยู่)'))return; const reason=prompt('เหตุผล (เช่น ลูกค้าร้องขอ):','ลูกค้าร้องขอ'); if(reason===null)return; try{ await api('/admin/members/'+id+'/anonymize',{method:'POST',body:JSON.stringify({reason})}); view360(id); loadMembers(); }catch(e){ alert(e.message); } }
function upgradeBlock(id,cur){
  if(!can('membership.manage')) return '';
  const curLevel=(TIERS.find(t=>t.code===cur)||{level:0}).level;
  const higher=TIERS.filter(t=>t.level>curLevel);
  const opts=higher.filter(t=>t.price_satang>0);
  if(!opts.length) return '<div class="muted" style="margin-top:10px">'+(higher.length?'ยังไม่เปิดให้ซื้ออัปเกรด (ตั้งราคาได้ที่เมนู “ระดับสมาชิก”) — ระดับเลื่อนอัตโนมัติตามพอยท์สะสม':'อยู่ระดับสมาชิกสูงสุดแล้ว')+'</div>';
  const branchOpts=BRANCHES.filter(b=>ME.branchIds.length===0||ME.branchIds.includes(b.id)).map(b=>`<option value="${b.id}">${esc(b.name)}</option>`).join('');
  return `<div class="card" style="margin-top:12px;background:#f2fbf5"><h3 style="margin:0 0 8px">อัปเกรดสมาชิก (จ่ายเงิน — เก็บเงินหน้าร้านก่อน)</h3><div class="row">
    <div class="field"><label>ระดับ</label><select id="up_tier">${opts.map(t=>`<option value="${t.code}">${esc(t.name)} — ฿${(t.price_satang/100).toFixed(0)} • ลด ${(t.discount_bps/100)}% • x${(t.earn_multiplier_bps/10000)} แต้ม • +${t.upgrade_bonus_points}</option>`).join('')}</select></div>
    <div class="field"><label>สาขา</label><select id="up_branch">${branchOpts}</select></div>
    <button class="brand sm" onclick="upgradeMember(${id})">ยืนยันรับเงินแล้ว + อัปเกรด</button></div><div id="up_out" class="muted" style="margin-top:6px"></div></div>`;
}
async function upgradeMember(id){
  const tierCode=$('up_tier').value; const t=TIERS.find(x=>x.code===tierCode)||{price_satang:0,name:tierCode};
  if(!confirm(`ยืนยันว่ารับเงินค่าสมาชิก ฿${(t.price_satang/100).toFixed(0)} แล้ว และอัปเกรดเป็น ${t.name}?`)) return;
  try{ await api('/admin/members/'+id+'/upgrade',{method:'POST',headers:{'idempotency-key':'up-'+id+'-'+Date.now()},body:JSON.stringify({tierCode,branchId:$('up_branch').value})});
    view360(id); loadMembers();
  }catch(e){ $('up_out').innerHTML='<span class="err">'+esc(e.message)+'</span>'; }
}

// ---- Receipt claims (staff review) ----
VIEWS.receipts=async()=>{
  const status=window.__rcStatus||'pending';
  const cs=(await api('/admin/receipts?status='+status)).claims;
  const tabs={pending:'รอตรวจ',approved:'อนุมัติแล้ว',rejected:'ไม่ผ่าน'};
  $('view').innerHTML=`<h2>ใบเสร็จรออนุมัติ</h2>
    <div class="banner">ลูกค้าถ่ายรูปใบเสร็จส่งเข้ามา — ตรวจรูป ยืนยันยอด แล้วอนุมัติเพื่อให้แต้ม (กันบิลซ้ำด้วยรหัส ID)</div>
    <div class="row" style="margin-bottom:12px">${Object.entries(tabs).map(([s,l])=>`<button class="sm ${s===status?'':'ghost'}" onclick="rcFilter('${s}')">${l}</button>`).join(' ')}</div>
    <div id="rc_items"></div>`;
  $('rc_items').innerHTML = cs.length? cs.map(rcCard).join('') : '<div class="card"><span class="muted">ไม่มีรายการ</span></div>';
  cs.forEach(c=>loadClaimImg(c.id));
  updateReceiptBadge();
};
function rcFilter(s){ window.__rcStatus=s; VIEWS.receipts(); }
function rcCard(c){
  const st=c.status==='approved'?`<span class="pill" style="background:#e6f4ea;color:#0b7a41">อนุมัติ +${c.points_awarded}</span>`:(c.status==='rejected'?'<span class="pill warn">ไม่ผ่าน</span>':'<span class="pill warn">รอตรวจ</span>');
  const editable=c.status==='pending';
  return `<div class="card" style="margin-bottom:12px;padding:14px"><div class="row" style="align-items:flex-start;gap:14px">
    <img id="ci_${c.id}" alt="receipt" style="width:120px;max-height:200px;object-fit:cover;border-radius:10px;border:1px solid var(--line);cursor:pointer;background:var(--surface-2)" onclick="if(this.src)window.open(this.src)"/>
    <div style="flex:1;min-width:220px">
      <div><b>สมาชิก #${c.member_id}</b> · สาขา ${esc(branchName(c.branch_id)||'-')} &nbsp;${st}</div>
      <div class="muted" style="font-size:12px;margin-top:2px">รหัสบิล: <code>${esc(c.receipt_code||'-')}</code> · วันบิล ${esc(c.receipt_date||'-')} · ลูกค้าแจ้ง ${c.claimed_total_satang?thb(c.claimed_total_satang):'-'} · ส่งเมื่อ ${new Date(c.created_at).toLocaleString('th-TH')}</div>
      ${editable?`<div class="muted" style="font-size:12px;margin-top:8px">อ่านจากรูป แล้วกรอก:</div>
        <div class="row" style="margin-top:6px">
        <div class="field"><label>สาขา</label><select id="br_${c.id}"><option value="">— เลือก —</option>${BRANCHES.filter(b=>ME.branchIds.length===0||ME.branchIds.includes(b.id)).map(b=>`<option value="${b.id}" ${c.branch_id===b.id?'selected':''}>${esc(b.name)}</option>`).join('')}</select></div>
        <div class="field"><label>รหัสบิล (ID)</label><input id="code_${c.id}" placeholder="เช่น OH6JK" value="${esc(c.receipt_code||'')}"/></div>
        <div class="field"><label>ยอดเงิน (บาท)</label><input id="amt_${c.id}" type="number" placeholder="เช่น 69" value="${c.claimed_total_satang?(c.claimed_total_satang/100):''}"/></div>
        <button class="brand sm" onclick="approveReceipt(${c.id})">อนุมัติ + ให้แต้ม</button>
        <button class="sm ghost" onclick="rejectReceipt(${c.id})">ไม่ผ่าน</button></div>
        <div id="rcout_${c.id}" class="muted" style="margin-top:4px"></div>`
        :(c.status==='approved'?`<div class="muted" style="font-size:13px;margin-top:6px">ให้ ${c.points_awarded} แต้ม · ยอด ${thb(c.awarded_total_satang||0)}</div>`
        :`<div class="muted" style="font-size:13px;margin-top:6px">เหตุผล: ${esc(c.reject_reason||'-')}</div>`)}
    </div></div></div>`;
}
async function loadClaimImg(id){ try{ const res=await fetch('/api/admin/receipts/'+id+'/image',{headers:{authorization:'Bearer '+TOKEN}}); if(!res.ok)return; const b=await res.blob(); const el=$('ci_'+id); if(el) el.src=URL.createObjectURL(b); }catch(e){} }
async function approveReceipt(id){ const amt=parseInt($('amt_'+id).value,10); const br=$('br_'+id).value; if(!br){ $('rcout_'+id).innerHTML='<span class="err">เลือกสาขาก่อน</span>'; return; } if(!amt){ $('rcout_'+id).innerHTML='<span class="err">ใส่ยอดเงิน (บาท) ก่อน</span>'; return; } try{ await api('/admin/receipts/'+id+'/approve',{method:'POST',headers:{'idempotency-key':'rc-'+id},body:JSON.stringify({awardedTotal:amt,branchId:br,receiptCode:$('code_'+id).value.trim()||null})}); VIEWS.receipts(); }catch(e){ $('rcout_'+id).innerHTML='<span class="err">'+esc(e.message)+'</span>'; } }
async function rejectReceipt(id){ const reason=prompt('เหตุผลที่ไม่ผ่าน?'); if(reason===null)return; try{ await api('/admin/receipts/'+id+'/reject',{method:'POST',body:JSON.stringify({reason})}); VIEWS.receipts(); }catch(e){ alert(e.message); } }

// ---- POS CSV import + product reports ----
VIEWS.posimport=async()=>{
  $('view').innerHTML=`<h2>นำเข้า POS (FoodStory) + รายงานสินค้า</h2>
    <div class="card"><h3>นำเข้าไฟล์ยอดขาย (CSV)</h3>
      <div class="muted" style="font-size:13px;margin-bottom:10px">FoodStory → รายงาน → ยอดขายแยกตามบิล (sale-by-bill-detail) → export CSV • ระบบจับคู่รหัสบิลกับใบเสร็จลูกค้า → ให้แต้มยอดจริงอัตโนมัติ + เก็บรายการสินค้า</div>
      <div id="dz" class="dropzone">📥 ลากไฟล์ CSV มาวางที่นี่ หรือ <b>คลิกเพื่อเลือกไฟล์</b><div id="dz_name" class="muted" style="margin-top:6px"></div></div>
      <input id="pi_file" type="file" accept=".csv,text/csv" style="display:none"/>
      <div class="progress" id="pi_prog"><i id="pi_bar"></i></div>
      <div id="pi_out" style="margin-top:10px"></div></div>
    <div class="card"><h3>ประวัติการนำเข้า</h3><div id="pi_hist"></div></div>
    <div class="cols">
      <div class="card"><h3>สินค้าขายดี (ตามยอด)</h3><div id="pi_top"><span class="muted">ยังไม่มีข้อมูล</span></div></div>
      <div class="card"><h3>ยอดขายตามหมวด</h3><div id="pi_cat"></div></div>
    </div>`;
  const dz=$('dz'), inp=$('pi_file');
  dz.onclick=()=>inp.click();
  inp.onchange=()=>{ if(inp.files[0]) startImport(inp.files[0]); };
  dz.ondragover=(e)=>{ e.preventDefault(); dz.classList.add('drag'); };
  dz.ondragleave=()=>dz.classList.remove('drag');
  dz.ondrop=(e)=>{ e.preventDefault(); dz.classList.remove('drag'); const f=e.dataTransfer.files[0]; if(f) startImport(f); };
  loadImports(); loadProductReports();
};
function uploadCsv(file,onProgress){
  return new Promise((resolve,reject)=>{
    const xhr=new XMLHttpRequest();
    xhr.open('POST','/api/admin/pos-import?filename='+encodeURIComponent(file.name));
    xhr.setRequestHeader('authorization','Bearer '+TOKEN);
    xhr.setRequestHeader('content-type','text/csv; charset=utf-8');
    xhr.upload.onprogress=(e)=>{ if(e.lengthComputable) onProgress(Math.round(e.loaded/e.total*100)); };
    xhr.onload=()=>{
      if(xhr.status>=200 && xhr.status<300){
        try{ resolve(JSON.parse(xhr.responseText)); }catch(e){ reject(new Error('Invalid JSON response')); }
      }else{
        try{
          const errData=JSON.parse(xhr.responseText);
          reject(new Error(errData?.error?.message||('HTTP '+xhr.status)));
        }catch(e){
          reject(new Error('HTTP '+xhr.status));
        }
      }
    };
    xhr.onerror=()=>reject(new Error('Network error'));
    xhr.send(file);
  });
}
async function startImport(file){
  $('dz_name').textContent=file.name;
  const prog=$('pi_prog'), bar=$('pi_bar'), out=$('pi_out');
  prog.style.display='block'; bar.style.width='0%'; out.innerHTML='กำลังอัปโหลด...';
  try{
    const res=await uploadCsv(file,p=>{ bar.style.width=p+'%'; });
    out.innerHTML=`<span class="ok">นำเข้าสำเร็จ! บิลทั้งหมด: ${res.billsCount||res.importedCount||0} รายการ</span>`;
    loadImports(); loadProductReports();
  }catch(e){
    out.innerHTML=`<span class="err">นำเข้าไม่สำเร็จ: ${esc(e.message)}</span>`;
  }finally{
    setTimeout(()=>{ prog.style.display='none'; },1000);
  }
}
async function loadImports(){
  try{
    const data=await api('/admin/pos-imports');
    const items=data.imports||data.history||[];
    $('pi_hist').innerHTML=items.length?`<table><thead><tr><th>ไฟล์</th><th>นำเข้าเมื่อ</th><th>ผู้ดำเนินการ</th><th>จำนวนบิล</th></tr></thead><tbody>${items.map(x=>`<tr><td>${esc(x.filename||x.file_name||'-')}</td><td class="muted">${new Date(x.created_at).toLocaleString('th-TH')}</td><td>${esc(x.created_by_name||x.username||'-')}</td><td>${x.bills_count||x.records_count||0}</td></tr>`).join('')}</tbody></table>`:'<span class="muted">ไม่มีประวัติการนำเข้า</span>';
  }catch(e){ $('pi_hist').innerHTML='<span class="err">'+esc(e.message)+'</span>'; }
}
async function loadProductReports(){
  try{
    const res=await api('/admin/pos-reports');
    const top=res.topProducts||res.top_products||[];
    const cats=res.categories||res.sales_by_category||[];
    $('pi_top').innerHTML=top.length?`<table><thead><tr><th>สินค้า</th><th>จำนวน</th><th>ยอดขายรวม</th></tr></thead><tbody>${top.map(p=>`<tr><td>${esc(p.name)}</td><td>${p.qty||p.quantity||0}</td><td>${thb(p.sales_satang||p.total_satang||0)}</td></tr>`).join('')}</tbody></table>`:'<span class="muted">ไม่มีข้อมูลสินค้า</span>';
    $('pi_cat').innerHTML=cats.length?`<table><thead><tr><th>หมวดหมู่</th><th>ยอดขายรวม</th></tr></thead><tbody>${cats.map(c=>`<tr><td>${esc(c.category||c.name||'อื่นๆ')}</td><td>${thb(c.sales_satang||c.total_satang||0)}</td></tr>`).join('')}</tbody></table>`:'<span class="muted">ไม่มีข้อมูลหมวดหมู่</span>';
  }catch(e){
    $('pi_top').innerHTML='<span class="muted">ไม่มีข้อมูล</span>';
    $('pi_cat').innerHTML='<span class="muted">ไม่มีข้อมูล</span>';
  }
}

boot();
</script>
